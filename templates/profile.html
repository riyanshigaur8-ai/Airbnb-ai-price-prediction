<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row">

        <!-- LEFT -->
        <div class="col-md-4">
            <div class="card p-4 shadow text-center">

                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" width="100">

                <h4 class="mt-3">{{ user['username'] }}</h4>
                <p class="text-muted">{{ user['email'] }}</p>

                <a href="/logout" class="btn btn-danger mt-3">Logout</a>

            </div>
        </div>

        <!-- RIGHT -->
        <div class="col-md-8">

            <!-- INFO -->
            <div class="card p-4 shadow mb-4">
                <h5>👤 Profile Info</h5>

                <p><b>Email:</b> {{ user['email'] }}</p>
                <p><b>Phone:</b> {{ user['phone'] }}</p>
                <p><b>Age:</b> {{ user['age'] }}</p>
            </div>

            <!-- EDIT FORM -->
            <div class="card p-4 shadow">
                <h5>✏️ Edit Profile</h5>

                <form method="POST" action="/update_profile">

                    <input name="email" value="{{ user['email'] }}" class="form-control mb-2">
                    <input name="phone" value="{{ user['phone'] }}" class="form-control mb-2">
                    <input name="age" value="{{ user['age'] }}" class="form-control mb-2">

                    <button class="btn btn-primary">Update</button>
                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
