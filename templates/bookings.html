<!DOCTYPE html>
<html>
<head>
    <title>Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">📅 Your Bookings</h2>

    <div class="card p-4 shadow">

        <table class="table">
            <thead>
                <tr>
                    <th>Location</th>
                    <th>Room Type</th>
                    <th>Price</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Manhattan</td>
                    <td>Entire Home</td>
                    <td>$120</td>
                    <td><span class="badge bg-success">Completed</span></td>
                </tr>

                <tr>
                    <td>Brooklyn</td>
                    <td>Private Room</td>
                    <td>$80</td>
                    <td><span class="badge bg-warning">Upcoming</span></td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

</body>
</html>
