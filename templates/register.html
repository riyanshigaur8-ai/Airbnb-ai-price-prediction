<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register - Airbnb Predictor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #36d1dc, #5b86e5);
            height: 100vh;
        }
        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center">

<div class="card shadow-lg p-4" style="width: 350px;">
    <h3 class="text-center mb-3">📝 Register</h3>

    <form method="POST">
        <input class="form-control mb-3" type="text" name="username" placeholder="Username" required>
        <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
        <input name="email" placeholder="Email" class="form-control mb-2" required>
        <input name="phone" placeholder="Phone" class="form-control mb-2">
        <input name="age" type="number" placeholder="Age" class="form-control mb-2">
        <button class="btn btn-primary w-100">Register</button>
    </form>

    <p class="text-center mt-3">
        Already have an account? <a href="/login">Login</a>
    </p>
</div>

</body>
</html>
